name: Mandob v2 web parity
on:
  push:
    branches:
      - feature/mandob-full-role-ui-parity
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-parity.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
